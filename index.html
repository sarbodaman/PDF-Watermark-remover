<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF watermark remover simple</title>
  <link rel="icon" type="image/x-icon" href="favicon.png">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- PDF-Lib -->
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f3f4f6;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.container{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
  width:95%;
  max-width:550px;
  text-align:center;
}
.dropzone{
  border:2px dashed #94a3b8;
  padding:25px;
  border-radius:10px;
  cursor:pointer;
}
button{
  margin-top:12px;
  padding:10px 16px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}
.progress{height:8px;background:#ddd;border-radius:10px;margin-top:10px;overflow:hidden}
.bar{height:100%;width:0%;background:#2563eb;transition:width .3s}
canvas{display:none}
</style>
</head>
<body>

<h1 style="position:absolute; top:20px; left:0; width:100%; margin:0; text-align:center">Hi There! Welcome to the PDF Watermark Remover</h1>

<div class="container">
<h2>PDF Watermark Remover </h2>

<div class="dropzone" id="dropzone">
Click, upload or Drag PDF Here
<input type="file" id="pdfInput" accept="application/pdf" hidden>
</div>

<button id="processBtn">Clean PDF</button>

<div class="progress"><div class="bar" id="bar"></div></div>
<p id="status">Waiting for thefile...</p>

<a id="downloadLink" style="display:none" download="cleaned.pdf">
<button>Download Cleaned PDF</button>
</a>

<canvas id="canvas"></canvas>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const input=document.getElementById("pdfInput");
const dropzone=document.getElementById("dropzone");
const btn=document.getElementById("processBtn");
const status=document.getElementById("status");
const bar=document.getElementById("bar");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const downloadLink=document.getElementById("downloadLink");

// Drag & Drop
function fileSelected(){
  const f=input.files[0];
  if(!f) return;
  status.innerText="File loaded: "+f.name+" - click Clean PDF";
  bar.style.background="#16a34a";
  bar.style.width="100%";
  downloadLink.style.display="none";
}
dropzone.onclick=()=>input.click();
input.onchange=fileSelected;
dropzone.ondragover=e=>{e.preventDefault();dropzone.style.opacity=.6};
dropzone.ondragleave=()=>dropzone.style.opacity=1;
dropzone.ondrop=e=>{
  e.preventDefault();
  input.files=e.dataTransfer.files;
  dropzone.style.opacity=1;
  fileSelected();
};

btn.onclick=async()=>{
 if(!input.files[0]){
   alert("Upload PDF first");
   return;
 }

 bar.style.background="#2563eb";
 bar.style.width="10%";

 const buffer=await input.files[0].arrayBuffer();

 status.innerText="Analyzing PDF structure...";

 const useStructural = await tryStructuralRemoval(buffer);

 if(useStructural){
   status.innerText="Structural cleaning successful (Text preserved).";
   return;
 }

 status.innerText="Switching to visual cleaning...";
 await visualCleaning(buffer);
};

// ===============================
// METHOD 1 — STRUCTURAL CLEANING
// ===============================
async function tryStructuralRemoval(buffer){
 try{
   const { PDFDocument } = PDFLib;
   const pdfDoc = await PDFDocument.load(buffer);
   const pages = pdfDoc.getPages();

   let removedSomething=false;

   // Watermarks repeat on (almost) every page, while real pictures usually
   // appear on one page only. So count how many pages use each object.
   const usage = {};
   pages.forEach(page=>{
     const dict = page.node.Resources();
     if(!dict) return;
     const xObject = dict.lookup(PDFLib.PDFName.of('XObject'));
     if(!xObject) return;
     xObject.keys().forEach(key=>{
       const ref = xObject.get(key);
       if(!(ref instanceof PDFLib.PDFRef)) return;
       const id = ref.toString();
       usage[id] = (usage[id] || 0) + 1;
     });
   });

   const minPages = Math.max(2, Math.ceil(pages.length * 0.6));

   pages.forEach(page=>{
     const dict = page.node.Resources();
     if(!dict) return;

     const xObject = dict.lookup(PDFLib.PDFName.of('XObject'));
     if(!xObject) return;

     xObject.keys().forEach(key=>{
       const ref = xObject.get(key);
       if(!(ref instanceof PDFLib.PDFRef)) return;
       // only remove objects repeated across most pages
       if(usage[ref.toString()] >= minPages){
         removedSomething=true;
         xObject.delete(key);
       }
     });
   });

   if(!removedSomething) return false;

   const pdfBytes = await pdfDoc.save();
   const blob=new Blob([pdfBytes],{type:"application/pdf"});
   const url=URL.createObjectURL(blob);

   downloadLink.href=url;
   downloadLink.style.display="inline-block";
   bar.style.width="100%";
   return true;

 }catch(e){
   console.log("Structural removal failed",e);
   return false;
 }
}

// ===============================
// METHOD 2 — VISUAL CLEANING
// ===============================
async function visualCleaning(buffer){
 const pdf=await pdfjsLib.getDocument({data:buffer}).promise;
 const images=[];

 for(let p=1;p<=pdf.numPages;p++){
   status.innerText=`Processing page ${p}/${pdf.numPages}`;
   bar.style.width=((p/pdf.numPages)*100)+"%";

   const page=await pdf.getPage(p);
   const viewport=page.getViewport({scale:2});

   canvas.width=viewport.width;
   canvas.height=viewport.height;

   await page.render({canvasContext:ctx,viewport}).promise;

   const img=ctx.getImageData(0,0,canvas.width,canvas.height);
   const data=img.data;

   for(let i=0;i<data.length;i+=4){
     const brightness=(data[i]+data[i+1]+data[i+2])/3;
     if(brightness>210){
       data[i]=255;
       data[i+1]=255;
       data[i+2]=255;
     }
   }

   ctx.putImageData(img,0,0);
   images.push(canvas.toDataURL("image/jpeg",1));
 }

 const script=document.createElement("script");
 script.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
 script.onload=()=>buildPDF(images);
 document.body.appendChild(script);
}

async function buildPDF(images){
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF();

 images.forEach((img,i)=>{
   if(i!==0) pdf.addPage();
   pdf.addImage(img,"JPEG",0,0,210,297);
 });

 const blob=pdf.output("blob");
 const url=URL.createObjectURL(blob);

 downloadLink.href=url;
 downloadLink.style.display="inline-block";
 status.innerText="Visual cleaning complete.";
 bar.style.width="100%";
}
</script>
</body>
</html>
